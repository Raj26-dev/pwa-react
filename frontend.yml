# This is workflow and isnide a workflow can be multiple jobs and inside a job there can be multiple steps

# this is workflow
name : Basic CI

on : push

# jobs
jobs :
  builds : 
    runs-on : ubuntu-latest

    # steps
    steps: 
      - name : Checkout respository
        uses : actions/checkout@v6

      - name : Set up Node.js
        uses : action/setup-node@v6
        with :
          node-version : 24
          cache : npm 

      - name : install dependencies
        run : npm ci

      - name : Create production build
        run : npm run bild      